<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORTRESS</title>
<style>
body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;max-width:420px;margin:40px auto;padding:0 16px}
input,button{width:100%;padding:10px;margin:6px 0;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;box-sizing:border-box}
button{background:#2563eb;border:0;cursor:pointer}
a{color:#60a5fa}.flash{background:#7f1d1d;padding:8px;border-radius:6px;margin:8px 0}
</style>
</head>
<body>
<h2>FORTRESS</h2>
{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}
</body>
</html>
